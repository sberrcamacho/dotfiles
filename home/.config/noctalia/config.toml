# Full list of options: `noctalia config export full`
# Changes made in the Settings UI are stored in ~/.local/state/noctalia/settings.toml (overrides this file).

[shell]
polkit_agent      = true            # replaces polkit-gnome (removed from niri autostart)
font_family       = "Lilex Nerd Font Medium"
time_format       = "{:%H:%M}"
telemetry_enabled = false
avatar_path       = "~/.face"
card_borders      = false

# Login (Noctalia Greeter): sincroniza fondo, colores y fuente al cambiar
[shell.greeter_sync]
auto_sync = true

# ─── Panels ───
[shell.panel]
transparency_mode               = "soft"
borders                         = false
control_center_placement        = "attached"
open_near_click_control_center  = true
launcher_placement              = "floating"
launcher_position               = "center"
open_near_click_launcher        = false
wallpaper_placement             = "attached"
session_placement               = "floating"
session_position                = "center"
list_item_background            = true        # cada resultado en su tarjeta (estilo v4)

# Launcher estilo v4: vertical, búsqueda arriba, lista con tarjetas
[shell.launcher]
layout          = "simple"      # 560×500, búsqueda arriba
app_grid        = false         # lista
categories      = false         # sin fila de categorías
compact         = false
show_icons      = true
sort_by_usage   = true

# Overview sin fondo desenfocado
[backdrop]
enabled        = false
blur_intensity = 0.4
tint_intensity = 0.6

[wallpaper]
enabled             = true
fill_mode           = "crop"
transition_duration = 1500
directory           = "~/Pictures/Wallpapers"

[wallpaper.automation]
enabled          = false
interval_seconds = 300
order            = "random"

[theme]
mode             = "dark"
source           = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

# Lockscreen: escritorio desenfocado detrás de la caja de login
[lockscreen]
blurred_desktop = true

[location]
auto_locate = true
address     = "Medellín, Colombia"

[weather]
enabled = true
unit    = "celsius"
effects = true

# ─── Bar ───
# Isla compacta pegada arriba (esquinas inferiores redondeadas), sin cápsulas.
#   start  = visualizador (solo con música)
#   center = solo la hora (fecha en el tooltip)
#   end    = [privacidad, grabando, bloq mayús, updates: solo cuando aplican], pomodoro, tray, red, batería, notificaciones
# Fuera de la barra: control center = click derecho en zona vacía / Mod+A; volumen = rueda sobre la barra
[bar.main]
position             = "top"
thickness            = 34
background_opacity   = 0.75
shadow               = true
contact_shadow       = false
border_width         = 0.0
radius               = 12
concave_edge_corners = true         # se funde con el borde superior
margin_edge          = 0            # pegada arriba
margin_ends          = 560          # isla de ~625 px
padding              = 12
widget_spacing       = 8
hover_highlight      = true
capsule              = false

start  = ["visualizer"]
center = ["clock"]
end    = ["privacy", "recording", "lock_keys", "updates", "pomodoro", "tray", "network", "battery", "notifications"]

[bar.main.dead_zone.actions]
left        = "panel-toggle launcher"
right       = "panel-toggle control-center"
scroll_up   = "volume-up"
scroll_down = "volume-down"

[widget.visualizer]
type           = "audio_visualizer"
width          = 72
bands          = 20
mirrored       = true
centered       = true
show_when_idle = false               # solo aparece mientras suena algo
color_1        = "primary"
color_2        = "tertiary"

[widget.clock]
type           = "clock"
format         = "{:%I:%M %p}"
tooltip_format = "{:%A, %d de %B de %Y}"

[widget.privacy]
type          = "privacy"
hide_inactive = true

[widget.tray]
type                   = "tray"
drawer                 = true
drawer_columns         = 3
hide_passive           = true
match_adjacent_spacing = true

[widget.network]
type       = "network"
show_label = false
vpn_status = "replace"

[widget.battery]
type       = "battery"
show_label = false

[widget.notifications]
type = "notifications"

# ─── Widgets contextuales: solo aparecen cuando hay algo que mostrar ───
[widget.lock_keys]
type           = "lock_keys"
hide_when_off  = true      # solo visible con Bloq Mayús activo
show_num_lock  = false     # numlock siempre está encendido
display        = "short"

[widget.recording]
type = "alexander/screen-toolkit:widget"   # punto rojo solo mientras grabas

[widget.updates]
type          = "yuuto/arch-updater:widget"
hide_on_empty = true

[widget.pomodoro]
type = "thepunkoff/pomodoro:widget"

# ─── Control Center ───
[control_center]
sidebar              = "compact"
show_shortcut_labels = true

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "audio"

[[control_center.shortcuts]]
type = "mic_mute"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "clipboard"

# ─── Notifications / OSD: mismo look que la barra (75%, sin borde) ───
[notification]
position           = "top_right"    # siempre arriba a la derecha, fuera de la isla
background_opacity = 0.75
border             = false
offset_x           = 8              # mismo margen que los gaps de niri
offset_y           = 8

[osd]
position           = "bottom_center"
offset_y           = 50             # un poco separado del borde inferior
background_opacity = 0.85
border             = true
border_color       = "primary"      # contraste con lo que haya detrás
border_width       = 1.5

# Templates de color para apps (mismo set que el UI)
[theme.templates]
builtin_ids   = ["btop", "gtk3", "gtk4", "kitty", "niri"]
community_ids = ["claude-code", "opencode", "spicetify", "zen-browser", "obsidian", "papirus-icons", "yazi"]

# ─── Plugins: sin widgets en la barra; se usan por atajo (niri) o lanzador ───
[plugin_settings."yuuto/arch-updater"]
auto_check_hours  = 6       # revisa solo y avisa con notificación
notify_on_updates = true

[plugin_settings."aristides/udiskie"]
enable_notifications = true # notificación al conectar/expulsar USB

[plugin_settings."alexander/screen-toolkit"]
hide-when-unused  = true      # widget de la barra solo durante una grabación
selected-ocr-lang = "spa+eng"   # OCR en español e inglés
video-path        = "~/Videos"
