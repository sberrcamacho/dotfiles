<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Fuentes por defecto del sistema -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Sans Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Apps/webs que piden fuentes de Windows/Mac explícitamente -->
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="same">
    <family>Segoe UI</family>
    <accept><family>Inter</family></accept>
  </alias>
  <alias binding="same">
    <family>-apple-system</family>
    <accept><family>Inter</family></accept>
  </alias>

  <!-- Inter: "l" con cola para distinguirla de "I" -->
  <match target="font">
    <test name="family" compare="eq"><string>Inter</string></test>
    <edit name="fontfeatures" mode="append">
      <string>cv05 on</string>
    </edit>
  </match>

  <!-- Renderizado: suavizado subpíxel RGB con hinting ligero (igual que tu config GTK) -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
